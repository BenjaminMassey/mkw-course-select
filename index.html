<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.1">
    <title>MKW Select</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <!-- Generated from images/courses/ by generate-courses.mjs; do not edit by hand. -->
    <script type="text/javascript" src="courses.js"></script>
    <script type="text/javascript" src="script.js"></script>
</head>
<body>
    <div id="root" class="container">
        <div id="exclusive-menu" class="container boxed exclusive">
            <div id="exclusive_label"
                class="label">
                Exclusive Mode
            </div>
            <div id="gui-items" class="horiz-container">
                <div class="container">
                    <img id="exclusive"
                        class="gui-element"
                        src="images/cross.webp"
                        onclick="toggleExclusive()" />
                    <div class="small-label">Enable</div>
                </div>
                <div class="container">
                    <img id="show_list"
                        class="gui-element"
                        src="images/list.webp"
                        onclick="toggleList()" />
                    <div class="small-label">List</div>
                </div>
                <div class="container">
                    <img id="auto-remove"
                        class="gui-element"
                        src="images/cross.webp"
                        onclick="toggleRemove()" />
                    <div class="small-label">Auto-Remove</div>
                </div>
            </div>
        </div>
        <div id="list-item-area" class="container" style="padding-top: 5vh">
            <img id="course"
                class="course"
                src="images/random.webp"
                onclick="randomize()" />
            <div id="label"
                class="label">
                Click me!
            </div>
            <div id="map_container" class="map-container">
              <img id="map"
                  class="map"
                  src="images/nothing.webp"
                  onclick="randomize()" />
            </div>
        </div>
    </div>

    <div id="list-mode" class="list-mode disabled">
        <div id="list-header" class="horiz-container">
            <div class="container">
                <img id="disable_list"
                    class="gui-element list-header"
                    src="images/disable.webp"
                    onclick="disableList()" />
                <div class="small-label">None</div>
            </div>
            <div class="container">
                <img id="reset_list"
                    class="gui-element list-header"
                    src="images/reset.webp"
                    onclick="resetList()" />
                <div class="small-label">All</div>
            </div>
            <div class="container">
                <img class="gui-element list-header"
                    src="images/close.webp"
                    onclick="toggleList()" />
                <div class="small-label">Close</div>
            </div>
        </div>
        <!-- Course items are built by script.js from the generated course list.
             layout_list() sizes the grid to fill this area at any viewport. -->
        <div id="list-grid"></div>
    </div>
    <!-- Map cache images are built by script.js from the generated course list. -->
    <div id="cache" class="cache"></div>
</body>
</html>
